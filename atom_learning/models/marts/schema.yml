version: 2

models:
  - name: fct_pupil_subject_sats_score
    description: >
      One row per pupil, subject and as_of_date. KS2 scaled score (80 to 120)
      from academic-year evidence up to as_of_date.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [pupil_id, subject_name, as_of_date]
    columns:
      - name: pupil_id
        data_tests: [not_null]
      - name: subject_name
        data_tests: [not_null]
      - name: as_of_date
        data_tests: [not_null]
      - name: score_status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  [
                    scored,
                    low_evidence,
                    below_scale,
                    no_answers,
                    no_sats_equivalent,
                  ]
      - name: sats_scaled_score
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 80
                max_value: 120
