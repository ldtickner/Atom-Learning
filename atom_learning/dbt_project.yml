name: "atom_learning"
version: "1.0.0"
profile: "atom_learning"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

models:
  atom_learning:
    staging:
      +materialized: view
    intermediate:
      +materialized: incremental
    marts:
      +materialized: table

seeds:
  atom_learning:
    ks2_scaled_score_conversion:
      +column_types:
        test_year: int64
        ks2_test: string
        subject_name: string
        raw_score: int64
        max_raw_score: int64
        scaled_score: int64
