name: "atom_learning"
version: "1.0.0"
profile: "atom_learning"

model-paths: ["models"]
analysis-paths: ["analyses"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Days of recent partitions each incremental run rebuilds, to catch late-arriving rows
  lookback_days: 3
  # Longest a scored sitting may stay open; responses are read this far further back (max seen: 19)
  max_sitting_days: 31

models:
  atom_learning:
    # Stop on a column change rather than leave old partitions null; fix with a deliberate --full-refresh
    +on_schema_change: fail
    staging:
      +materialized: view
    intermediate:
      +materialized: incremental
    marts:
      +materialized: table

seeds:
  atom_learning:
    ks2_scaled_score_conversion:
      +column_types:
        test_year: int64
        ks2_test: string
        subject_name: string
        raw_score: int64
        max_raw_score: int64
        scaled_score: int64
